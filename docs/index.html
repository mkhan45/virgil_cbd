<html>
    <body>
        <div id="container">
            <div id="sidebar">
                <h2 id="label"> </h2>
                <div id="tags">
                    <button id="prev-tag">&lt;</button>
                    <select id="tag-select"></select>
                    <button id="next-tag">&gt;</button>
                </div>
                <hr>
                <input type="text" id="search" placeholder="Search opcodes...">
                <div id="codes"> </div>
            </div>
            <div id="graph-container">
                <pre id="graph"></pre>
            </div>
        </div>
        <script src="traces.js" charset="utf-8"></script>
        <script type="module">
              import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs';
              import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs';
              import Fuse from 'https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.mjs';

            mermaid.registerLayoutLoaders(elkLayouts);

            const theme = {
                'primaryColor': '#ffffff',
                'primaryTextColor': '#000000',
                'background': '#ffffff',
                'primaryBorderColor': '#000000',
                'fontFamily': 'monospace',
            };
            // mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: theme, layout: 'elk' });
            mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: theme });
            window.mermaid = mermaid;

            const graph = document.getElementById('graph');
            const label = document.getElementById('label');
            const tagSelect = document.getElementById('tag-select');
            const prevBtn = document.getElementById('prev-tag');
            const nextBtn = document.getElementById('next-tag');

            let currentCode = null;
            let currentTagList = [];

            function getDefaultTag(code) {
                const tags = Object.keys(traces[code]);
                return tags.includes('raw') ? 'raw' : tags[0];
            }

            prevBtn.onclick = async () => {
                const idx = currentTagList.indexOf(tagSelect.value);
                const newIdx = idx <= 0 ? currentTagList.length - 1 : idx - 1;
                await setGraph(currentCode, currentTagList[newIdx]);
            };

            nextBtn.onclick = async () => {
                const idx = currentTagList.indexOf(tagSelect.value);
                const newIdx = idx >= currentTagList.length - 1 ? 0 : idx + 1;
                await setGraph(currentCode, currentTagList[newIdx]);
            };

            tagSelect.onchange = async () => {
                await setGraph(currentCode, tagSelect.value);
            };

            async function setGraph(code, tag, updateHistory = true) {
                const rect = graph.getBoundingClientRect();
                const barrierDiv = graph.cloneNode(true);

                barrierDiv.style.position = 'absolute';
                barrierDiv.style.zIndex = '5';
                barrierDiv.style.background = 'white';
                barrierDiv.style.left = rect.left;
                barrierDiv.style.top = rect.top;
                barrierDiv.style.width = rect.width;
                barrierDiv.style.height = rect.height;
                graph.parentNode.appendChild(barrierDiv);
                graph.style.opacity = 0;

                graph.setAttribute("data-processed", "");
                graph.innerHTML = traces[code][tag];
                label.innerText = "Rendering...";
                await mermaid.run({ querySelector: '.graph' });
                label.innerText = code + ", " + tag;

                currentCode = code;
                currentTagList = Object.keys(traces[code]);
                if (updateHistory) history.pushState(null, '', '#' + code + '#' + tag);

                tagSelect.innerHTML = '';
                for (const t of currentTagList) {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    if (t === tag) opt.selected = true;
                    tagSelect.appendChild(opt);
                }

                graph.querySelectorAll('svg').forEach(svg => {
                    const viewBox = svg.getAttribute('viewBox');
                    if (viewBox) {
                        const [, , vbWidth, vbHeight] = viewBox.split(' ').map(Number);
                        const aspectRatio = vbWidth / vbHeight;
                        const containerWidth = graph.parentNode.clientWidth * 0.95;
                        const minHeightPx = window.innerHeight * 0.7;
                        let finalHeight = Math.max(vbHeight, minHeightPx);
                        let finalWidth = aspectRatio * finalHeight;
                        if (finalWidth > containerWidth) {
                            finalWidth = containerWidth;
                            finalHeight = finalWidth / aspectRatio;
                        }
                        svg.setAttribute('height', finalHeight + 'px');
                        svg.setAttribute('width', finalWidth + 'px');
                    }
                });

                barrierDiv.remove();
                graph.style.opacity = 1;
            }
            function parseHash() {
                const parts = window.location.hash.slice(1).split('#');
                return { code: parts[0] || null, tag: parts[1] || null };
            }

            window.addEventListener('hashchange', async () => {
                const { code, tag } = parseHash();
                if (code && traces[code]) {
                    const resolvedTag = (tag && traces[code][tag]) ? tag : getDefaultTag(code);
                    await setGraph(code, resolvedTag, false);
                }
            });

            const { code: hashCode, tag: hashTag } = parseHash();
            const initialCode = (hashCode && traces[hashCode]) ? hashCode
                : (traces["BR_IF"] != undefined ? "BR_IF" : "UNREACHABLE");
            const initialTag = (hashTag && traces[initialCode]?.[hashTag]) ? hashTag : getDefaultTag(initialCode);
            await setGraph(initialCode, initialTag, false);

            const codes = document.getElementById('codes');
            for (const op in traces) {
                const btn = document.createElement('button');
                btn.textContent = op;
                btn.onclick = async () => {
                    await setGraph(op, getDefaultTag(op));
                };
                codes.appendChild(btn);
            }

            // Setup fuzzy search
            const searchInput = document.getElementById('search');
            const opcodeList = Object.keys(traces);
            const fuse = new Fuse(opcodeList, { threshold: 0.2 });
            const allButtons = codes.querySelectorAll('button');

            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim();
                if (!query) {
                    allButtons.forEach(btn => btn.style.display = '');
                    return;
                }
                const matches = new Set(fuse.search(query).map(r => r.item));
                allButtons.forEach(btn => {
                    btn.style.display = matches.has(btn.textContent) ? '' : 'none';
                });
            });

            // Spacebar focuses search (when not in input)
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            // Escape unfocuses search, Enter selects first visible match
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.blur();
                } else if (e.key === 'Enter') {
                    const firstVisible = Array.from(allButtons).find(btn => btn.style.display !== 'none');
                    if (firstVisible) {
                        firstVisible.click();
                        searchInput.blur();
                    }
                }
            });
        </script>
        <style>
            body {
                margin: 0;
                font-family: monospace;
            }

            #container {
                display: flex;
            }

            #sidebar {
                height: 100vh;
                min-width: 21ch;
                max-width: 48ch;
                width: 48ch;
                resize: horizontal;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            #label {
                font-size: 1.5em;
                line-height: 1;
                margin: 10px 0;
                height: 2em;
            }

            #tags {
                display: flex;
                gap: 2px;
            }

            #sidebar hr {
                margin: 5px 0;
                width: 100%;
            }

            #search {
                width: 100%;
                box-sizing: border-box;
                font-family: monospace;
                padding: 4px;
                margin-bottom: 5px;
            }

            #codes {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(20ch, 1fr));
                align-content: start;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            button {
                padding: 0;
                font-family: monospace;
            }

            #codes button {
                min-width: 0;
            }

            #prev-tag, #next-tag {
                min-width: 3ch;
                flex-shrink: 0;
            }

            #tag-select {
                font-family: monospace;
                flex-grow: 1;
                min-width: 0;
            }

            #graph-container {
                flex: 1;
                overflow-y: auto;
                overflow-x: hidden;
                height: 100vh;
                background-color: white;
            }

            #graph {
                margin: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                font-size: 1.2em;
                padding-top: 5vh;
            }

            .flowchart-link {
                stroke-width: 2.5px !important;
            }

            .label-container, .label-container path {
                stroke-width: 2.5px !important;
            }
        </style>
    </body>
</html>
