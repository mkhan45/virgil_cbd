<html>
    <head><meta charset="utf-8"></head>
    <body>
        <div id="container">
            <div id="sidebar">
                <h2 id="label"> </h2>
                <div id="tags">
                    <button id="prev-tag">&lt;</button>
                    <select id="tag-select"></select>
                    <button id="next-tag">&gt;</button>
                </div>
                <hr>
                <input type="text" id="search" placeholder="Search opcodes...">
                <div id="codes"> </div>
            </div>
            <div id="graph-container">
                <pre id="graph"></pre>
                <div id="zoom-controls">
                    <button id="zoom-in"  title="Zoom in">+</button>
                    <button id="zoom-out" title="Zoom out">−</button>
                    <button id="zoom-fit" title="Fit to view">⊙</button>
                    <span id="zoom-hint">scroll · drag · dbl-click fit</span>
                </div>
            </div>
        </div>
        <script src="traces.js" charset="utf-8"></script>
        <script type="module">
              import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs';
              import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs';
              import Fuse from 'https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.mjs';

            mermaid.registerLayoutLoaders(elkLayouts);

            const theme = {
                'primaryColor': '#ffffff',
                'primaryTextColor': '#000000',
                'background': '#ffffff',
                'primaryBorderColor': '#000000',
                'fontFamily': 'monospace',
            };
            // mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: theme, layout: 'elk' });
            mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: theme });
            window.mermaid = mermaid;

            const graph = document.getElementById('graph');
            const graphContainer = document.getElementById('graph-container');
            const label = document.getElementById('label');
            const tagSelect = document.getElementById('tag-select');
            const prevBtn = document.getElementById('prev-tag');
            const nextBtn = document.getElementById('next-tag');

            let currentCode = null;
            let currentTagList = [];

            // ── Zoom / pan state ──────────────────────────────────────────────
            let zoomState = { scale: 1, tx: 0, ty: 0 };
            let zoomAbort = null;

            function applyTransform() {
                const { scale, tx, ty } = zoomState;
                graph.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            }

            function fitView() {
                const svg = graph.querySelector('svg');
                if (!svg) return;
                const viewBox = svg.getAttribute('viewBox');
                if (!viewBox) return;
                const [, , vbW, vbH] = viewBox.split(' ').map(Number);
                if (!vbW || !vbH) return;

                // Pin the SVG to its natural 1:1 viewBox size so that mermaid's internal
                // font sizes (e.g. "16px" in SVG units) map 1:1 to CSS pixels, keeping
                // text and box sizes consistent. All visual scaling is done via the CSS
                // transform on #graph; overflow:visible prevents any clipping.
                svg.setAttribute('width',  vbW + 'px');
                svg.setAttribute('height', vbH + 'px');

                const cW = graphContainer.clientWidth;
                const cH = graphContainer.clientHeight;
                const scale = Math.min(cW / vbW, cH / vbH) * 0.95;
                const tx = (cW - vbW * scale) / 2;
                const ty = (cH - vbH * scale) / 2;
                zoomState = { scale, tx, ty };
                applyTransform();
            }

            function setupZoomPan() {
                if (zoomAbort) zoomAbort.abort();
                zoomAbort = new AbortController();
                const { signal } = zoomAbort;

                // Wheel → zoom toward cursor
                graphContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                    const rect = graphContainer.getBoundingClientRect();
                    const mx = e.clientX - rect.left;
                    const my = e.clientY - rect.top;
                    const { scale, tx, ty } = zoomState;
                    zoomState = {
                        scale: scale * factor,
                        tx: mx - (mx - tx) * factor,
                        ty: my - (my - ty) * factor,
                    };
                    applyTransform();
                }, { passive: false, signal });

                // Mouse drag → pan
                let dragging = false, startX, startY, startTx, startTy;

                graphContainer.addEventListener('mousedown', (e) => {
                    // Ignore clicks on the zoom-controls overlay
                    if (e.target.closest('#zoom-controls')) return;
                    dragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startTx = zoomState.tx;
                    startTy = zoomState.ty;
                    graphContainer.style.cursor = 'grabbing';
                    e.preventDefault();
                }, { signal });

                window.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    zoomState = {
                        ...zoomState,
                        tx: startTx + (e.clientX - startX),
                        ty: startTy + (e.clientY - startY),
                    };
                    applyTransform();
                }, { signal });

                window.addEventListener('mouseup', () => {
                    if (!dragging) return;
                    dragging = false;
                    graphContainer.style.cursor = 'grab';
                }, { signal });

                // Double-click → fit to view
                graphContainer.addEventListener('dblclick', (e) => {
                    if (e.target.closest('#zoom-controls')) return;
                    fitView();
                }, { signal });
            }

            // Zoom control buttons
            document.getElementById('zoom-in').onclick  = () => {
                const { scale, tx, ty } = zoomState;
                const cx = graphContainer.clientWidth  / 2;
                const cy = graphContainer.clientHeight / 2;
                const factor = 1.25;
                zoomState = { scale: scale * factor, tx: cx - (cx - tx) * factor, ty: cy - (cy - ty) * factor };
                applyTransform();
            };
            document.getElementById('zoom-out').onclick = () => {
                const { scale, tx, ty } = zoomState;
                const cx = graphContainer.clientWidth  / 2;
                const cy = graphContainer.clientHeight / 2;
                const factor = 1 / 1.25;
                zoomState = { scale: scale * factor, tx: cx - (cx - tx) * factor, ty: cy - (cy - ty) * factor };
                applyTransform();
            };
            document.getElementById('zoom-fit').onclick = fitView;

            // ── Graph loading ─────────────────────────────────────────────────
            function getDefaultTag(code) {
                const tags = Object.keys(traces[code]);
                return tags.includes('raw') ? 'raw' : tags[0];
            }

            prevBtn.onclick = async () => {
                const idx = currentTagList.indexOf(tagSelect.value);
                const newIdx = idx <= 0 ? currentTagList.length - 1 : idx - 1;
                await setGraph(currentCode, currentTagList[newIdx]);
            };

            nextBtn.onclick = async () => {
                const idx = currentTagList.indexOf(tagSelect.value);
                const newIdx = idx >= currentTagList.length - 1 ? 0 : idx + 1;
                await setGraph(currentCode, currentTagList[newIdx]);
            };

            tagSelect.onchange = async () => {
                await setGraph(currentCode, tagSelect.value);
            };

            async function setGraph(code, tag, updateHistory = true) {
                const rect = graph.getBoundingClientRect();
                const barrierDiv = graph.cloneNode(true);

                barrierDiv.style.position = 'absolute';
                barrierDiv.style.zIndex = '5';
                barrierDiv.style.background = 'white';
                barrierDiv.style.left = rect.left;
                barrierDiv.style.top = rect.top;
                barrierDiv.style.width = rect.width;
                barrierDiv.style.height = rect.height;
                graph.parentNode.appendChild(barrierDiv);
                graph.style.opacity = 0;

                graph.setAttribute("data-processed", "");
                graph.innerHTML = traces[code][tag];
                label.innerText = "Rendering...";
                // Reset transform to identity before mermaid renders: mermaid measures
                // text via getBoundingClientRect(), which returns transformed coordinates.
                // Any existing scale on #graph would corrupt its layout measurements.
                graph.style.transform = 'none';
                await mermaid.run({ querySelector: '.graph' });
                label.innerText = code + ", " + tag;

                currentCode = code;
                currentTagList = Object.keys(traces[code]);
                if (updateHistory) history.pushState(null, '', '#' + code + '#' + tag);

                tagSelect.innerHTML = '';
                for (const t of currentTagList) {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    if (t === tag) opt.selected = true;
                    tagSelect.appendChild(opt);
                }

                // Fit the new graph to the viewport, then arm zoom/pan.
                fitView();
                setupZoomPan();

                barrierDiv.remove();
                graph.style.opacity = 1;
            }

            function parseHash() {
                const parts = window.location.hash.slice(1).split('#');
                return { code: parts[0] || null, tag: parts[1] || null };
            }

            window.addEventListener('hashchange', async () => {
                const { code, tag } = parseHash();
                if (code && traces[code]) {
                    const resolvedTag = (tag && traces[code][tag]) ? tag : getDefaultTag(code);
                    await setGraph(code, resolvedTag, false);
                }
            });

            const { code: hashCode, tag: hashTag } = parseHash();
            const initialCode = (hashCode && traces[hashCode]) ? hashCode
                : (traces["BR_IF"] != undefined ? "BR_IF" : 
                    traces["UNREACHABLE"] != undefined ? "UNREACHABLE" :
                    Object.keys(traces)[0]);
            const initialTag = (hashTag && traces[initialCode]?.[hashTag]) ? hashTag : getDefaultTag(initialCode);
            await setGraph(initialCode, initialTag, false);

            const codes = document.getElementById('codes');
            for (const op in traces) {
                const btn = document.createElement('button');
                btn.textContent = op;
                btn.onclick = async () => {
                    await setGraph(op, getDefaultTag(op));
                };
                codes.appendChild(btn);
            }

            // Setup fuzzy search
            const searchInput = document.getElementById('search');
            const opcodeList = Object.keys(traces);
            const fuse = new Fuse(opcodeList, { threshold: 0.2 });
            const allButtons = codes.querySelectorAll('button');

            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim();
                if (!query) {
                    allButtons.forEach(btn => btn.style.display = '');
                    return;
                }
                const matches = new Set(fuse.search(query).map(r => r.item));
                allButtons.forEach(btn => {
                    btn.style.display = matches.has(btn.textContent) ? '' : 'none';
                });
            });

            // Spacebar focuses search (when not in input)
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                    e.preventDefault();
                    searchInput.focus();
                }
            });

            // Escape unfocuses search, Enter selects first visible match
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.blur();
                } else if (e.key === 'Enter') {
                    const firstVisible = Array.from(allButtons).find(btn => btn.style.display !== 'none');
                    if (firstVisible) {
                        firstVisible.click();
                        searchInput.blur();
                    }
                }
            });
        </script>
        <style>
            body {
                margin: 0;
                font-family: monospace;
            }

            #container {
                display: flex;
            }

            #sidebar {
                height: 100vh;
                min-width: 21ch;
                max-width: 48ch;
                width: 48ch;
                resize: horizontal;
                overflow: visible;
                display: flex;
                flex-direction: column;
                z-index: 1;
            }

            #label {
                font-size: 1.5em;
                line-height: 1;
                margin: 10px 0;
                height: 2em;
            }

            #tags {
                display: flex;
                gap: 2px;
            }

            #sidebar hr {
                margin: 5px 0;
                width: 100%;
            }

            #search {
                width: 100%;
                box-sizing: border-box;
                font-family: monospace;
                padding: 4px;
                margin-bottom: 5px;
            }

            #codes {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(20ch, 1fr));
                align-content: start;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
            }

            button {
                padding: 0;
                font-family: monospace;
            }

            #codes button {
                min-width: 0;
            }

            #prev-tag, #next-tag {
                min-width: 3ch;
                flex-shrink: 0;
            }

            #tag-select {
                font-family: monospace;
                flex-grow: 1;
                min-width: 0;
            }

            #graph-container {
                flex: 1;
                overflow: visible;
                height: 100vh;
                position: relative;
                background-color: white;
                cursor: grab;
                user-select: none;
            }

            #graph {
                position: absolute;
                transform-origin: 0 0;
                margin: 0;
                padding: 0;
            }

            #zoom-controls {
                position: absolute;
                bottom: 12px;
                right: 12px;
                display: flex;
                align-items: center;
                gap: 4px;
                z-index: 10;
                background: rgba(255,255,255,0.85);
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 4px 8px;
            }

            #zoom-controls button {
                width: 2.2em;
                height: 2.2em;
                font-size: 1.1em;
                cursor: pointer;
                border: 1px solid #bbb;
                border-radius: 4px;
                background: #f5f5f5;
            }

            #zoom-controls button:hover {
                background: #e0e0e0;
            }

            #zoom-hint {
                font-size: 0.75em;
                color: #888;
                margin-left: 4px;
                white-space: nowrap;
            }

            #graph svg {
                overflow: hidden;
            }

            .flowchart-link {
                stroke-width: 2.5px !important;
            }

            .label-container, .label-container path {
                stroke-width: 2.5px !important;
            }
        </style>
    </body>
</html>
