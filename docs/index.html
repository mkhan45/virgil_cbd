<html>
    <body style="margin-top: 0px; margin-bottom: 0px; font-family: monospace">
        <div style="display: flex; margin-top: none; padding-top: none;">
            <div style="max-width: 45ch; height: 100vh">
                <h2 id="label" style="font-size: 1.5em; line-height: 1; margin-bottom: 10px; margin-top: 10px"> </h2>
                <div class="tags" id="tags" style="max-height: 15vh; overflow-y: scroll"> </div>
                <hr style="margin-top: 5px; margin-bottom: 5px">
                <div style="max-height: calc(100vh - 15vh - 1.5em - 20px - 10px - 1px); overflow-y: scroll" class="codes" id="codes"> </div>
            </div>
            <div style="flex-grow: 2; display: flex; justify-content: center; z-index: 1; background-color: white;">
                <pre id="graph" style="margin-top: 0px; margin-bottom: 0px"></pre>
            </div>
        </div>
        <script src="traces.js" charset="utf-8"></script>
        <script type="module">
            import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
            import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs';

            mermaid.registerLayoutLoaders(elkLayouts);

            const theme = {
                'primaryColor': '#ffffff',
                'primaryTextColor': '#000000',
                'background': '#ffffff',
                'primaryBorderColor': '#000000',
                'fontFamily': 'monospace',
            };
            mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: theme, layout: 'elk' });
            window.mermaid = mermaid;

            const graph = document.getElementById('graph');
            const label = document.getElementById('label');
            async function setGraph(code, tag) {
                const rect = graph.getBoundingClientRect();
                const barrierDiv = graph.cloneNode(true);

                barrierDiv.style.position = 'absolute';
                barrierDiv.style.zIndex = '5';
                barrierDiv.style.background = 'white';
                barrierDiv.style.left = rect.left;
                barrierDiv.style.top = rect.top;
                barrierDiv.style.width = rect.width;
                barrierDiv.style.height = rect.height;
                graph.parentNode.appendChild(barrierDiv);
                graph.style.opacity = 0;

                graph.setAttribute("data-processed", "");
                graph.innerHTML = traces[code][tag];
                label.innerText = "Rendering...";
                await mermaid.run({ querySelector: '.graph' });
                label.innerText = code + ", " + tag;

                tags.replaceChildren([]);
                for (const tag in traces[code]) {
                    const btn = document.createElement('button');
                    btn.textContent = tag;
                    btn.onclick = async () => {
                        await setGraph(code, tag);
                    };
                    tags.appendChild(btn);
                    if (graph.querySelector('svg') != null) {
                        graph.querySelector('svg').setAttribute('width', '');
                        graph.querySelector('svg').setAttribute('height', '90vh');
                    }
                }

                barrierDiv.remove();
                graph.style.opacity = 1;
            }
            if (traces["BR_IF"] != undefined) {
                await setGraph("BR_IF", "raw");
            } else {
                await setGraph("UNREACHABLE", "raw");
            }

            const codes = document.getElementById('codes');
            for (const op in traces) {
                const btn = document.createElement('button');
                btn.textContent = op;
                btn.onclick = async () => {
                    await setGraph(op, "raw");
                };

                codes.appendChild(btn);
            }
        </script>
        <style>
            button {
                min-width: 20ch;
                padding: 0;
                font-family: monospace;
            }

            .flowchart-link {
                stroke-width: 2.5px !important;
            }

            .label-container, .label-container path {
                stroke-width: 2.5px !important;
            }

            #graph > pre {
                font-size: 1.2em;
                margin-top: 5vh;
            }
        </style>
    </body>
</html>
